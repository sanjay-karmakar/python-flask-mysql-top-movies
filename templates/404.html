{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container text-center my-5 py-5">
    <h1 class="display-1 fw-bold text-danger">404</h1>
    <h2 class="mb-3">Oops! Movie or Page Not Found</h2>
    <p class="text-muted mb-4">
        The movie ID or page you are looking for doesn't exist or may have been deleted.
    </p>
    <a href="{{ url_for('home') }}" class="button" style="text-decoration: none;">
        Back to My Top 10 Movies
    </a>
</div>
{% endblock %}
